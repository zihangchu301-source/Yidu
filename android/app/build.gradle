plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

// 把网页资源同步进 APK 的 assets：直接复用仓库根目录的 static/ 和 source/templates/，
// 不在仓库里存第二份副本，避免改了代码忘了同步。
def syncStatic = tasks.register("syncWebStatic", Sync) {
    from("${rootProject.projectDir}/../static") {
        include "app.js", "style.css", "brand.png", "mobile.css", "mobile.js"
    }
    into "${projectDir}/src/main/assets/static"
}

def syncTemplates = tasks.register("syncWebTemplates", Sync) {
    from("${rootProject.projectDir}/../source/templates") {
        include "index.html"
    }
    into "${projectDir}/src/main/assets/templates"
}

// Python 源码同步到 Chaquopy 的默认目录 src/main/python。
// 这样不依赖 srcDir 的相对路径解析（它按模块目录算，容易指错），
// 也保证每次构建拿到的都是仓库根 source/ 的最新代码。
def syncPython = tasks.register("syncPythonSources", Sync) {
    from("${rootProject.projectDir}/../source") {
        include "*.py"
    }
    from("${rootProject.projectDir}/../python_shims") {
        include "*.py", "openai/**"
    }
    into "${projectDir}/src/main/python"
}

tasks.named("preBuild").configure {
    dependsOn syncStatic, syncTemplates, syncPython
}

// Chaquopy 的 mergeDebugPythonSources 会读取 src/main/python，必须显式声明依赖，
// 否则 Gradle 8 的任务校验会直接报错（implicit dependency）。
tasks.matching {
    it.name != "syncPythonSources" && it.name.toLowerCase().contains("python")
}.configureEach {
    dependsOn syncPython
}

// 配置阶段先同步一次：不管哪个 Chaquopy 任务先跑，源码都已就位（这几步只是拷十几个小文件）
syncPython.get().copy()

// 构建时生成版本文件：同一份内容既打进 APK（供"当前版本"读取），
// 也由 CI 上传到 Release（供"最新版本"比对）。version_code 递增即表示有新版。
def versionAsset = file("${projectDir}/src/main/assets/version.json")
versionAsset.parentFile.mkdirs()
def builtAt = new Date().format("yyyy-MM-dd'T'HH:mm:ss'Z'", TimeZone.getTimeZone("UTC"))
def runNo = System.getenv("GITHUB_RUN_NUMBER") ?: "1"
def versionNameStr = "1.0." + runNo
// 每版一个独立文件名：固定链接 yidu-1.0-debug.apk 容易被 CDN / 浏览器缓存成旧包，
// 应用内更新改用 yidu-<版本>.apk，URL 每次都不一样，绝不会下到旧版本。
versionAsset.setText(groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson([
        built_at    : builtAt,
        app         : "译读",
        version_name: versionNameStr,
        version_code: runNo.toInteger(),
        apk         : "https://github.com/zihangchu301-source/Yidu/releases/download/android-latest/yidu-${versionNameStr}.apk",
])), "UTF-8")

// 固定签名：CI 从 GitHub Secrets 注入同一个 keystore，
// 每次构建签名一致 → 可直接覆盖安装，用户数据不丢。
// 本地开发没有这些环境变量时回退到默认 debug 签名。
def ksB64 = System.getenv("YIDU_KEYSTORE_BASE64")
if (ksB64) {
    file("${projectDir}/yidu-release.jks").bytes = java.util.Base64.getDecoder().decode(ksB64)
}

android {
    namespace "com.zihang.yidu"
    compileSdk 34

    defaultConfig {
        applicationId "com.zihang.yidu"
        minSdk 24
        targetSdk 34
        versionCode(runNo.toInteger())
        versionName(versionNameStr)
        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a"
        }
    }

    if (ksB64) {
        signingConfigs {
            yidu {
                storeFile file("${projectDir}/yidu-release.jks")
                storePassword System.getenv("YIDU_KEYSTORE_PASSWORD")
                keyAlias System.getenv("YIDU_KEY_ALIAS")
                keyPassword System.getenv("YIDU_KEY_PASSWORD")
                // minSdk >= 24 时 AGP 默认只签 v2/v3，APK 里没有 META-INF/*.RSA。
                // 部分国产手机安装器据此报「安装包没有签名文件」，必须同时开 v1。
                v1SigningEnabled true
                v2SigningEnabled true
            }
        }
    }
    // 没有注入密钥时（本地构建）也保证默认 debug 签名带 v1
    signingConfigs {
        debug {
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }

    buildTypes {
        debug {
            if (ksB64) signingConfig signingConfigs.yidu
        }
        release {
            if (ksB64) signingConfig signingConfigs.yidu
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

chaquopy {
    defaultConfig {
        // 目标 Python 版本（Chaquopy 自带运行时）
        version = "3.10"
        // 构建机上的 Python 必须与之同版本：GitHub Actions 的 ubuntu-22.04 自带 3.10
        buildPython("python3")
        pip {
            install "flask"
            install "ebooklib"
            install "beautifulsoup4"
            install "tenacity"
        }
    }
}
