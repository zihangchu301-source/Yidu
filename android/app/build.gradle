plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

// 把网页资源同步进 APK 的 assets：直接复用仓库根目录的 static/ 和 source/templates/，
// 不在仓库里存第二份副本，避免改了代码忘了同步。
def syncStatic = tasks.register("syncWebStatic", Sync) {
    from("${rootProject.projectDir}/../static") {
        include "app.js", "style.css", "brand.png"
    }
    into "${projectDir}/src/main/assets/static"
}

def syncTemplates = tasks.register("syncWebTemplates", Sync) {
    from("${rootProject.projectDir}/../source/templates") {
        include "index.html"
    }
    into "${projectDir}/src/main/assets/templates"
}

// Python 源码同步到 Chaquopy 的默认目录 src/main/python。
// 这样不依赖 srcDir 的相对路径解析（它按模块目录算，容易指错），
// 也保证每次构建拿到的都是仓库根 source/ 的最新代码。
def syncPython = tasks.register("syncPythonSources", Sync) {
    from("${rootProject.projectDir}/../source") {
        include "*.py"
    }
    from("${rootProject.projectDir}/../python_shims") {
        include "*.py", "openai/**"
    }
    into "${projectDir}/src/main/python"
}

tasks.named("preBuild").configure {
    dependsOn syncStatic, syncTemplates, syncPython
}

// Chaquopy 的 mergeDebugPythonSources 会读取 src/main/python，必须显式声明依赖，
// 否则 Gradle 8 的任务校验会直接报错（implicit dependency）。
tasks.matching {
    it.name != "syncPythonSources" && it.name.toLowerCase().contains("python")
}.configureEach {
    dependsOn syncPython
}

// 配置阶段先同步一次：不管哪个 Chaquopy 任务先跑，源码都已就位（这几步只是拷十几个小文件）
syncPython.get().copy()

android {
    namespace "com.zihang.yidu"
    compileSdk 34

    defaultConfig {
        applicationId "com.zihang.yidu"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
        ndk {
            // 只打真机常用的两种架构，APK 体积小一半
            abiFilters "arm64-v8a", "armeabi-v7a"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

chaquopy {
    defaultConfig {
        // 目标 Python 版本（Chaquopy 自带运行时）
        version = "3.10"
        // 构建机上的 Python 必须与之同版本：GitHub Actions 的 ubuntu-22.04 自带 3.10
        buildPython("python3")
        pip {
            install "flask"
            install "ebooklib"
            install "beautifulsoup4"
            install "tenacity"
        }
    }
}
