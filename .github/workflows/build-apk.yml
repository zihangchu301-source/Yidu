name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "source/**"
      - "static/**"
      - "python_shims/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Ensure pip for Chaquopy build python
        run: |
          python3 -m pip --version || sudo apt-get update && sudo apt-get install -y python3-pip
          python3 --version

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.5"

      - name: Build debug APK
        env:
          # 固定签名密钥（GitHub Secrets）：保证每次构建签名一致，可直接覆盖安装
          YIDU_KEYSTORE_BASE64: ${{ secrets.YIDU_KEYSTORE_BASE64 }}
          YIDU_KEYSTORE_PASSWORD: ${{ secrets.YIDU_KEYSTORE_PASSWORD }}
          YIDU_KEY_ALIAS: ${{ secrets.YIDU_KEY_ALIAS }}
          YIDU_KEY_PASSWORD: ${{ secrets.YIDU_KEY_PASSWORD }}
        run: |
          set -o pipefail
          gradle -p android assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/build.log | tail -50
          status=$?
          if [ $status -ne 0 ]; then
            {
              echo "## Gradle 失败摘要"
              echo '```'
              grep -nE "What went wrong|FAILURE|error:|Caused by|chaquopy|Chaquopy|python|Python" /tmp/build.log | head -80
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit $status
          fi

      - name: Inspect APK
        run: |
          set -x
          APK=$(ls android/app/build/outputs/apk/debug/*.apk | head -1)
          cp "$APK" android/app/build/outputs/apk/debug/yidu-1.0-debug.apk
          {
            echo "## APK 内容诊断"
            echo '```'
            ls -lh "$APK"
            echo "--- chaquopy / python 相关条目 ---"
            unzip -l "$APK" | grep -Ei "chaquopy|libpython" || echo "(无)"
            echo "--- 业务代码 app.zip ---"
            if unzip -l "$APK" | grep -q "assets/chaquopy/app.zip"; then
              rm -rf /tmp/appchk && mkdir -p /tmp/appchk
              unzip -q -o "$APK" "assets/chaquopy/app.zip" -d /tmp/appchk
              unzip -l /tmp/appchk/assets/chaquopy/app.zip || true
            else
              echo "(没有 app.zip)"
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          ls -l /tmp/appchk/assets/chaquopy/ 2>/dev/null || true

      - name: Assert Python code is bundled
        run: |
          APK=$(ls android/app/build/outputs/apk/debug/*.apk | head -1)
          rm -rf /tmp/appchk && mkdir -p /tmp/appchk
          unzip -q -o "$APK" "assets/chaquopy/app.imy" -d /tmp/appchk
          ls -l /tmp/appchk/assets/chaquopy/app.imy
          unzip -l /tmp/appchk/assets/chaquopy/app.imy | tee /tmp/applist.txt | head -20
          grep -q "server.pyc" /tmp/applist.txt || { echo "ERROR: app.imy 里没有 server 模块"; exit 1; }
          grep -q "yidu_android.pyc" /tmp/applist.txt || { echo "ERROR: 缺 yidu_android"; exit 1; }
          grep -q "openai" /tmp/applist.txt || { echo "ERROR: 缺 openai 兼容层"; exit 1; }
          echo "OK: Python 业务代码齐全"

      - name: Verify v1 + v2 signature
        run: |
          APK=$(ls android/app/build/outputs/apk/debug/yidu-1.0-debug.apk | head -1)
          echo "--- 签名文件 ---"
          unzip -l "$APK" | grep -E "META-INF/.*\.(RSA|DSA|EC)" || {
            echo "ERROR: 缺少 v1 签名文件，部分手机会报「安装包没有签名文件」"; exit 1;
          }
          echo "OK: 含 v1 签名"

      - name: Report build error to release notes
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view android-latest >/dev/null 2>&1 || \
            gh release create android-latest --prerelease --title "安卓版（自动构建）" --notes "init"
          MSG=$(grep -A 30 "What went wrong" /tmp/build.log 2>/dev/null | head -40 || true)
          if [ -z "$MSG" ]; then
            MSG=$(tail -40 /tmp/build.log 2>/dev/null || echo "no log")
          fi
          printf '构建失败（诊断）：\n\n```\n%s\n```\n' "$MSG" > /tmp/notes.md
          gh release edit android-latest --notes-file /tmp/notes.md

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: yidu-apk
          path: android/app/build/outputs/apk/debug/yidu-1.0-debug.apk
          retention-days: 30

      - name: Publish rolling release (手机可直接下载)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TAG=android-latest
          APKDIR=android/app/build/outputs/apk/debug
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --prerelease \
              --title "安卓版（自动构建）" \
              --notes "每次推送自动发布新版本。"
          VER=$(python3 -c "import json;print(json.load(open('android/app/src/main/assets/version.json'))['version_name'])")
          cp "$APKDIR/yidu-1.0-debug.apk" "$APKDIR/yidu-${VER}.apk"

          # 每版一个独立文件名：固定链接容易被 CDN 缓存成旧包，
          # 应用内更新走这个唯一 URL。旧的版本包清掉，只留当前这一版。
          for old in $(gh release view "$TAG" --json assets --jq '.assets[].name' | grep -E '^yidu-1\.0\.[0-9]+\.apk$' || true); do
            if [ "$old" != "yidu-${VER}.apk" ]; then
              gh release delete-asset "$TAG" "$old" -y || true
            fi
          done
          gh release upload "$TAG" \
            "$APKDIR/yidu-1.0-debug.apk" \
            "$APKDIR/yidu-${VER}.apk" \
            android/app/src/main/assets/version.json --clobber
          gh release edit "$TAG" --notes "最新版本 ${VER}（$(date -u +%Y-%m-%dT%H:%MZ)）。手机内点「检查更新」可直接覆盖安装，不会丢数据。"
          echo "固定下载：https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/yidu-1.0-debug.apk"
          echo "本版唯一链接：https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/yidu-${VER}.apk"

