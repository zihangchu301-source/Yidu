name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "source/**"
      - "static/**"
      - "python_shims/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Ensure pip for Chaquopy build python
        run: |
          python3 -m pip --version || sudo apt-get update && sudo apt-get install -y python3-pip
          python3 --version

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.5"

      - name: Build debug APK
        run: gradle -p android assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: yidu-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
