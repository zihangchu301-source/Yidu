name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "source/**"
      - "static/**"
      - "python_shims/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Ensure pip for Chaquopy build python
        run: |
          python3 -m pip --version || sudo apt-get update && sudo apt-get install -y python3-pip
          python3 --version

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.5"

      - name: Build debug APK
        run: gradle -p android assembleDebug --no-daemon --stacktrace

      - name: Verify APK contains Python runtime
        run: |
          APK=$(ls android/app/build/outputs/apk/debug/*.apk | head -1)
          ls -lh "$APK"
          echo "--- 运行时库 ---"
          unzip -l "$APK" | grep -Ei "libpython|libchaquopy" | head -20 || true
          unzip -l "$APK" | grep -qi "libpython" || { echo "ERROR: APK 里没有 libpython"; exit 1; }
          echo "--- 业务代码是否打进 app.zip ---"
          unzip -l "$APK" | grep -q "assets/chaquopy/app.zip" || { echo "ERROR: 缺少 assets/chaquopy/app.zip（Python 源码未打包，检查 python.srcDirs）"; exit 1; }
          rm -rf /tmp/appchk && mkdir -p /tmp/appchk
          unzip -q -o "$APK" "assets/chaquopy/app.zip" -d /tmp/appchk
          unzip -l /tmp/appchk/assets/chaquopy/app.zip | tee /tmp/applist.txt | head -30
          grep -q "server" /tmp/applist.txt || { echo "ERROR: app.zip 里没有 server 模块"; exit 1; }
          grep -q "yidu_android" /tmp/applist.txt || { echo "ERROR: app.zip 里没有 yidu_android 启动模块"; exit 1; }
          grep -q "openai" /tmp/applist.txt || { echo "ERROR: app.zip 里没有 openai 兼容层"; exit 1; }
          cp "$APK" android/app/build/outputs/apk/debug/yidu-1.0-debug.apk
          echo "OK: 代码与运行时齐全"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: yidu-apk
          path: android/app/build/outputs/apk/debug/yidu-1.0-debug.apk
          retention-days: 30

      - name: Publish rolling release (手机可直接下载)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view android-latest >/dev/null 2>&1 || \
            gh release create android-latest --prerelease \
              --title "安卓版（自动构建）" \
              --notes "每次推送自动覆盖更新的调试版 APK，直接下载安装即可。"
          gh release upload android-latest android/app/build/outputs/apk/debug/yidu-1.0-debug.apk --clobber
          echo "下载地址：https://github.com/${GITHUB_REPOSITORY}/releases/download/android-latest/yidu-1.0-debug.apk"
