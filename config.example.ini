; ============================================================
;  配置模板：把本文件复制为 config.ini 并填入你的 API Key
;  支持任何 OpenAI 兼容格式的 API（DeepSeek / Kimi / OpenAI ...）
; ============================================================

[api]
; ---- API Key：从大模型服务商控制台获取 ----
api_key    = sk-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx

; ---- Base URL：必须以 /v1 结尾 ----
; DeepSeek     : https://api.deepseek.com/v1
; Kimi/Moonshot: https://api.moonshot.cn/v1
; 通义千问      : https://dashscope.aliyuncs.com/compatible-mode/v1
; OpenAI 官方  : https://api.openai.com/v1
base_url   = https://api.deepseek.com/v1

; ---- 模型名称 ----
; DeepSeek : deepseek-chat
; Kimi     : moonshot-v1-8k / moonshot-v1-32k
; OpenAI   : gpt-4o-mini / gpt-4o
model      = deepseek-chat


[translation]
; 并发线程数上限（建议 2~8，过大易触发限流）
max_workers        = 5

; 一个请求内最多包含的“源文字符数”，用于把多个段落拼成一批
max_chars_per_req  = 1800

; 单次 HTTP 请求超时（秒）
request_timeout    = 120

; 重试：最大尝试次数（含首次）
max_retries        = 6

; 重试：指数退避起始秒数（2,4,8,16... 上限 60 秒）
retry_wait_base    = 2

; 术语表抽取时，从全书中等距抽样的段落数量
glossary_sample    = 120

; 每翻译多少批更新一次“前文摘要”（用于上下文连贯）
summary_window     = 8

; 模型温度（翻译建议 0.2~0.4，越低越稳定）
temperature        = 0.3


[server]
; 服务监听地址（本机使用保持 127.0.0.1 即可）
host = 127.0.0.1

; 端口；若被占用可改成 5001 / 8000 等
port = 5000

; 启动后是否自动打开浏览器（true / false）
auto_open_browser = true


[ui]
; 阅读器默认字号（像素）
default_font_size = 19

; 上次选择的主题（启动时恢复）：light（浅色） 或 dark（深色）
default_theme = dark


[cloud]
; ---- 账号与云端同步（不填也能正常用，只是不能跨设备同步）----
; 两个值都在 Supabase 后台 → Project Settings → API 里：
;   supabase_url      = Project URL        （形如 https://xxxx.supabase.co）
;   supabase_anon_key = anon / public key  （很长的一串 eyJ...）
;
; 注意：这里只能填 anon key，**绝对不要填 service_role key**（那个会绕过所有权限）。
;
; 国内访问建议用阿里云的 Supabase 兼容实例（杭州，免费 1C2G，地址形如
; https://xxxx.supabase.opentrust.net），比官方新加坡节点快很多。
;
; 建表：把 docs/supabase_schema.sql 全文粘到 Supabase 的 SQL Editor 执行一次。
supabase_url      =
supabase_anon_key =

; 是否启用云端同步（false 则「设置」里不显示账号入口）
sync_enabled      = true
